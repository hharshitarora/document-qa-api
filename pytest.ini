[pytest]
asyncio_mode = auto
testpaths = tests
# Put the repo root on the import path so `pytest` works, not just `python -m pytest`.
# The latter adds the current directory itself, which hid this: the README says `pytest`,
# and without this line a fresh clone fails collection with "No module named 'app'".
pythonpath = .
# Starlette's test client imports an anyio alias that anyio has deprecated. Nothing here
# triggers it and no version of either package avoids it today. Silenced by exact message
# rather than by category, so a real deprecation in this project still shows up.
filterwarnings =
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
